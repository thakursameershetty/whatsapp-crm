<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="no-autofill.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · SendON</title>
  <link rel="icon" type="image/svg+xml" href="/brand/logo-small.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <script>try{var t=localStorage.getItem('theme')||'light';document.documentElement.dataset.mode=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}catch(e){}</script>
</head>
<body class="ax-body">
  <script>try{if(localStorage.getItem('ax-side')==='collapsed')document.documentElement.classList.add('ax-collapsed')}catch(e){}</script>
  <aside class="ax-side" aria-label="Admin">
    <div class="ax-side-top">
      <a class="ax-brand" href="#/overview" title="SendON Admin"><img src="/brand/logo-small.svg" alt="" /><span class="ax-lbl"><b>SendON</b><span>Admin</span></span></a>
      <button type="button" class="ax-collapse" id="axCollapse" aria-label="Collapse sidebar" title="Collapse sidebar"></button>
    </div>
    <nav class="ax-tabs" id="tabs" aria-label="Admin sections"></nav>
    <div class="ax-side-foot">
      <a class="ax-tab" href="/" title="Back to the app"><span class="ax-ic" data-icon="arrow-left" data-icon-size="16"></span><span class="ax-lbl">Back to the app</span></a>
    </div>
  </aside>
  <main class="ax-main" id="view"><div class="ax-loading">Loading…</div></main>
  <div id="toasts"></div>
  <script src="icons.js"></script>
  <script src="motion.js"></script>
  <script src="coin.js"></script>
<script>
// The admin panel: tabs across the top (Overview, Workspaces, People, Issues, Deletion requests, System) and a page
// per workspace with its own tabs. The address says where you are (#/workspaces, #/w/<id>/credits), so Back works.
// "Main" and "sub-workspace" aren't stored anywhere: when one account owns several workspaces, its oldest is the main
// one and the rest are its sub-workspaces; a workspace whose owner has no other is "separate".
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, s = 15) => LA.icon(n, s);
const n = (x) => Number(x || 0).toLocaleString('en-IN');
const ago = (t) => { if (!t) return '—'; const m = (Date.now() - Date.parse(t)) / 60000; return m < 1 ? 'just now' : m < 60 ? Math.round(m) + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
const date = (t) => (t ? new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '—');
function toast(msg, err) { const el = document.createElement('div'); el.className = 'toast' + (err ? ' error' : ''); el.textContent = msg; $('#toasts').append(el); setTimeout(() => el.remove(), 3800); }
async function api(path, opts = {}) {
  const r = await fetch('/api' + path, { method: opts.method || 'GET', headers: { 'Content-Type': 'application/json' }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const COLORS = 6;
const hue = (t) => { let h = 0; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return (h % COLORS) + 1; };
const initial = (t) => (String(t || '?').trim().match(/[A-Za-z0-9]/) || ['?'])[0].toUpperCase();
const av = (t, cls = '') => `<span class="adm-av ${cls}" style="--av:var(--file-${hue(t)})">${esc(initial(t))}</span>`;
const DAY7 = 7 * 86400000;
const isActive = (w) => !w.suspended && w.lastActivity && Date.now() - Date.parse(w.lastActivity) < DAY7;
const failRate = (w) => (w.sent30d ? Math.round((100 * w.failed30d) / w.sent30d) : null);
const rateCls = (r) => (r == null ? '' : r >= 20 ? 'bad' : r >= 8 ? 'warn' : 'good');

// --- Data ------------------------------------------------------------------------------------------------------------
const S = { all: [], reps: [], dels: [], gv: null, loaded: false, wsQ: '', wsF: '', open: new Set(), pQ: '', repF: 'open', detail: null }; // open: main workspaces unfolded on the Workspaces tab

// Who owns a workspace (its earliest owner), and how workspaces sit together under one owner.
const ownerOf = (w) => w.members.filter((m) => m.role === 'owner').sort((a, b) => String(a.joinedAt || '').localeCompare(String(b.joinedAt || '')))[0] || null;
function structure() {
  const by = new Map();
  for (const w of S.all) {
    const o = ownerOf(w), k = o?.id || 'none:' + w.id;
    if (!by.has(k)) by.set(k, { owner: o, list: [] });
    by.get(k).list.push(w);
  }
  for (const g of by.values()) g.list.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
  const rel = new Map(); // workspace id -> { kind: main|sub|sep, group }
  for (const g of by.values()) g.list.forEach((w, i) => rel.set(w.id, { kind: g.list.length > 1 ? (i === 0 ? 'main' : 'sub') : 'sep', group: g }));
  const groups = [...by.values()].filter((g) => g.list.length > 1).sort((a, b) => b.list.length - a.list.length || String(a.owner?.email).localeCompare(String(b.owner?.email)));
  const separate = [...by.values()].filter((g) => g.list.length === 1).map((g) => g.list[0]);
  return { rel, groups, separate };
}
const relTag = (kind) => ({ main: '<span class="ax-tag main">Main</span>', sub: '<span class="ax-tag sub">Sub-workspace</span>', sep: '<span class="ax-tag sep">Separate</span>' }[kind] || '');

async function loadAll() {
  const [all, reps, dels, gv, prepaid] = await Promise.all([
    api('/admin/workspaces'),
    api('/admin/reports').catch(() => []),
    api('/admin/deletion-requests').catch(() => []),
    api('/admin/graph-version').catch(() => null),
    api('/admin/prepaid').catch(() => []),
  ]);
  Object.assign(S, { all, reps, dels, gv, prepaid, loaded: true });
}

// --- Tabs and routing ------------------------------------------------------------------------------------------------
const TABS = [
  ['overview', 'Overview', 'layout-grid'],
  ['workspaces', 'Workspaces', 'layers'],
  ['people', 'People', 'users'],
  ['issues', 'Issues', 'badge-alert'],
  ['requests', 'Deletion requests', 'delete'],
  ['system', 'System', 'settings'],
];
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'w' && parts[1]) return { tab: 'workspaces', ws: decodeURIComponent(parts[1]), sub: parts[2] || 'overview' };
  return { tab: TABS.some(([k]) => k === parts[0]) ? parts[0] : 'overview' };
}
function drawTabs(r) {
  const open = S.reps.filter((x) => x.status === 'open').length;
  const count = { workspaces: S.all.length, people: people().length, issues: open, requests: S.dels.length };
  const cls = { issues: open ? 'warn' : '', requests: S.dels.length ? 'bad' : '' };
  // Collapsed, only the icons show: the name is the hover text, and a coloured dot stands in for an urgent count.
  $('#tabs').innerHTML = TABS.map(([k, label, icon]) => {
    const c = count[k] != null && (count[k] || k === 'workspaces' || k === 'people') ? count[k] : null;
    return `<a class="ax-tab ${r.tab === k ? 'on' : ''}" href="#/${k}" title="${label}${c ? ` (${n(c)})` : ''}" ${r.tab === k ? 'aria-current="page"' : ''}><span class="ax-ic">${ic(icon, 16)}${c && cls[k] ? `<i class="ax-dot ${cls[k]}"></i>` : ''}</span><span class="ax-lbl">${label}</span>${c != null ? `<span class="ax-count ${cls[k] || ''}">${n(c)}</span>` : ''}</a>`;
  }).join('');
}
async function render() {
  const r = route();
  if (!S.loaded) { try { await loadAll(); } catch (e) { $('#view').innerHTML = `<div class="ax-card ax-empty"><b>Couldn't load the admin panel</b>${esc(e.message)}</div>`; return; } }
  drawTabs(r);
  const view = $('#view');
  if (r.ws) await renderWorkspace(r.ws, r.sub);
  else view.innerHTML = ({ overview: overviewHtml, workspaces: workspacesHtml, people: peopleHtml, issues: issuesHtml, requests: requestsHtml, system: systemHtml }[r.tab])();
  document.title = (r.ws ? (S.detail?.name || 'Workspace') : TABS.find(([k]) => k === r.tab)[1]) + ' · Admin · SendON';
  LA.hydrate(document);
  Motion.segs?.(document);
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
async function reload() { S.loaded = false; S.detail = null; await render(); }

// --- Overview --------------------------------------------------------------------------------------------------------
function kpi(icon, label, value, sub, cls = '') { return `<div class="ax-kpi ${cls}"><i>${ic(icon, 15)}</i><span>${label}</span><b>${value}</b><small>${sub}</small></div>`; }
function pricingNote() {
  const live = S.all[0]?.pricingLive;
  return live || !S.all.length ? '' : '<div class="adm-pricing-off"><b>Pricing is off.</b> Nothing is charged and there are no number limits. Plans and credits you set are kept for when it’s switched on: add <code>PRICING=on</code> to the server’s variables (Railway → Variables) and redeploy.</div>';
}
function overviewHtml() {
  const all = S.all, st = structure();
  const sent = all.reduce((a, w) => a + w.sent30d, 0), failed = all.reduce((a, w) => a + w.failed30d, 0), today = all.reduce((a, w) => a + w.sent24h, 0);
  const rate = sent ? Math.round((100 * failed) / sent) : 0;
  const open = S.reps.filter((x) => x.status === 'open');
  // Things to look at, most urgent first
  const items = [];
  for (const d of S.dels) items.push(`<a href="#/requests"><i class="bad">${ic('delete', 15)}</i><span><b>${esc(d.name || d.email)}</b> asked to delete their account<small>${esc(d.reasonText || '')} · ${ago(d.at)}</small></span></a>`);
  for (const r of open.slice(0, 4)) items.push(`<a href="#/issues"><i class="warn">${ic('badge-alert', 15)}</i><span><b>${esc(r.area)}</b> reported in ${esc(r.workspace)}<small>${esc(r.message)}</small></span></a>`);
  if (open.length > 4) items.push(`<a href="#/issues"><i class="warn">${ic('badge-alert', 15)}</i><span><b>${open.length - 4} more open issues</b></span></a>`);
  for (const w of all.filter((x) => x.billing === 'credits' && x.pricingLive && !x.credits)) items.push(`<a href="#/w/${w.id}/credits"><i class="bad">${ic('zap', 15)}</i><span><b>${esc(w.name)}</b> is out of credits<small>Sending and AI are on hold</small></span></a>`);
  for (const w of all.filter((x) => (failRate(x) ?? 0) >= 20 && x.sent30d >= 20)) items.push(`<a href="#/w/${w.id}"><i class="warn">${ic('triangle-alert', 15)}</i><span><b>${esc(w.name)}</b>: ${failRate(w)}% of messages failed in 30 days<small>${n(w.failed30d)} of ${n(w.sent30d)}</small></span></a>`);
  for (const w of all.filter((x) => x.suspended)) items.push(`<a href="#/w/${w.id}/settings"><i class="info">${ic('lock', 15)}</i><span><b>${esc(w.name)}</b> is suspended<small>${w.suspendedAt ? 'since ' + date(w.suspendedAt) : ''}</small></span></a>`);
  const top = all.filter((w) => w.sent30d).sort((a, b) => b.sent30d - a.sent30d).slice(0, 6), max = top[0]?.sent30d || 1;
  const newest = all.slice().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))).slice(0, 5);
  const subs = st.groups.reduce((a, g) => a + g.list.length - 1, 0);
  return `
    <div class="ax-h"><div><h1>Overview</h1><p>Every workspace on this server: usage, limits and health.</p></div></div>
    ${pricingNote()}
    <section class="ax-kpis">
      ${kpi('layout-grid', 'Workspaces', n(all.length), `${all.filter(isActive).length} active this week${all.some((w) => w.suspended) ? ` · ${all.filter((w) => w.suspended).length} suspended` : ''}`)}
      ${kpi('send', 'Messages, 30 days', n(sent), `${n(today)} today`)}
      ${kpi('badge-alert', 'Failure rate, 30 days', sent ? rate + '%' : '—', sent ? `${n(failed)} failed` : 'nothing sent', rate >= 20 ? 'bad' : rate >= 8 ? 'warn' : '')}
      ${kpi('bell', 'Needs attention', n(items.length), items.length ? 'see the list below' : 'All clear', items.length ? 'warn' : 'good')}
    </section>
    <div class="ax-grid2">
      <section class="ax-card"><h3>${ic('bell', 16)}Needs attention</h3>
        ${items.length ? `<div class="ax-attn">${items.join('')}</div>` : `<div class="ax-allclear">${ic('circle-check', 16)}Nothing needs you right now.</div>`}
      </section>
      <section class="ax-card"><h3>${ic('trending-up', 16)}Most active, 30 days<a class="ax-link" href="#/workspaces">All workspaces</a></h3>
        ${top.length ? `<div class="ax-top5">${top.map((w) => `<a href="#/w/${w.id}"><b>${esc(w.name)}</b><span class="adm-bar"><i style="width:${Math.max(4, (100 * w.sent30d) / max)}%"></i></span><em>${n(w.sent30d)}</em></a>`).join('')}</div>` : '<p class="ax-muted" style="margin:0">Nothing sent in the last 30 days.</p>'}
      </section>
    </div>
    <div class="ax-grid2">
      <section class="ax-card"><h3>${ic('layers', 16)}How workspaces are organised<a class="ax-link" href="#/workspaces">See them</a></h3>
        <div class="ax-struct">
          <div><b>${n(st.groups.length)}</b><span>Main workspaces with sub-workspaces</span></div>
          <div><b>${n(subs)}</b><span>Sub-workspaces under them</span></div>
          <div><b>${n(st.separate.length)}</b><span>Workspaces on their own</span></div>
        </div>
      </section>
      <section class="ax-card"><h3>${ic('plus', 16)}Newest workspaces</h3>
        <div class="ax-top5">${newest.map((w) => `<a href="#/w/${w.id}"><b>${esc(w.name)}</b><span class="ax-muted" style="font-size:12.5px">${esc(ownerOf(w)?.email || 'No owner')}</span><em>${ago(w.createdAt)}</em></a>`).join('')}</div>
      </section>
    </div>`;
}

// --- Workspaces --------------------------------------------------------------------------------------------------------
const WS_FILTERS = [['', 'All', () => true], ['active', 'Active', isActive], ['idle', 'Idle', (w) => !w.suspended && !isActive(w)], ['suspended', 'Suspended', (w) => w.suspended]];
function wsMatches(w) {
  const f = WS_FILTERS.find((x) => x[0] === S.wsF) || WS_FILTERS[0], q = S.wsQ.trim().toLowerCase();
  return f[2](w) && (!q || w.name.toLowerCase().includes(q) || w.members.some((m) => (m.email || '').toLowerCase().includes(q) || (m.name || '').toLowerCase().includes(q)));
}
const rowHead = () => `<div class="ax-row head"><span>Workspace</span><span class="c-owner">Owner</span><span class="c-plan">Plan</span><span class="num c-nums">Numbers</span><span class="num c-sent">Sent 30d</span><span class="c-fail">Failed 30d</span><span class="c-last">Last active</span><span></span></div>`;
// One row. Every row has two lines (name, then tags or the date it was made), so all rows are the same height.
// A main workspace starts with an arrow that unfolds its sub-workspaces underneath.
function wsRow(w, rel, opts = {}) {
  const r = failRate(w), o = ownerOf(w);
  const plan = w.billing === 'credits' ? `<span class="ax-plan ${w.credits ? '' : 'zero'}">${n(w.credits)} credits</span>` : '<span class="ax-plan free">Free plan</span>';
  const subs = rel.kind === 'main' ? rel.group.list.length - 1 : 0, open = S.open.has(w.id);
  const tags = [
    subs ? `<button type="button" class="ax-tag sub ax-subs" data-toggle="${w.id}" aria-expanded="${open}">${subs} sub-workspace${subs === 1 ? '' : 's'}</button>` : '',
    rel.kind === 'sub' ? '<span class="ax-tag sub">Sub-workspace</span>' : '',
    w.suspended ? '<span class="ax-tag bad">Suspended</span>' : '',
    w.demoMode ? '<span class="ax-tag warn">Demo</span>' : '',
    w.legacy ? '<span class="ax-tag">Original</span>' : '',
    w.openReports ? `<span class="ax-tag warn">${w.openReports} open issue${w.openReports === 1 ? '' : 's'}</span>` : '',
  ].join('');
  const lead = subs ? `<button type="button" class="ax-twist ${open ? 'open' : ''}" data-toggle="${w.id}" aria-expanded="${open}" aria-label="${open ? 'Hide' : 'Show'} the sub-workspaces of ${esc(w.name)}">${ic('chevron-down', 15)}</button>` : '<span class="ax-twist-space"></span>';
  return `<div class="ax-row ${rel.kind === 'sub' ? 'sub' : ''} ${opts.last ? 'last' : ''} ${w.suspended ? 'is-off' : ''}" data-href="#/w/${w.id}">
    <span class="ax-who">${lead}${av(w.name)}<div><a href="#/w/${w.id}" title="${esc(w.name)}">${esc(w.name)}</a><small>${tags || `<span>since ${date(w.createdAt)}</span>`}</small></div></span>
    <span class="ax-owner c-owner" title="${esc(o?.email || '')}">${esc(o?.email || 'No owner')}${w.members.length > 1 ? ` <span class="ax-faint">+${w.members.length - 1}</span>` : ''}</span>
    <span class="c-plan">${plan}</span>
    <span class="num c-nums">${w.numbers || '<span class="ax-faint">0</span>'}</span>
    <span class="num c-sent">${w.sent30d ? n(w.sent30d) : '<span class="ax-faint">0</span>'}</span>
    <span class="c-fail">${r == null ? '<span class="ax-faint">—</span>' : `<span class="ax-fail ${rateCls(r)}"><span class="adm-bar"><i style="width:${Math.min(100, Math.max(3, r))}%"></i></span><b>${r}%</b></span>`}</span>
    <span class="c-last ${isActive(w) ? '' : 'ax-muted'}">${w.lastActivity ? ago(w.lastActivity) : 'Never'}</span>
    <span class="ax-chev">${ic('chevron-down', 15)}</span>
  </div>`;
}
// All workspaces in one table: main and separate workspaces at the top level, sub-workspaces folded under their main
// one. A search or filter that matches a sub-workspace shows it under its main workspace, unfolded.
function workspacesHtml() {
  const st = structure(), searching = Boolean(S.wsQ.trim() || S.wsF);
  const tops = S.all.filter((w) => st.rel.get(w.id)?.kind !== 'sub');
  const rows = [];
  let shown = 0;
  for (const w of tops) {
    const rel = st.rel.get(w.id), subs = rel.kind === 'main' ? rel.group.list.slice(1) : [];
    const subHits = subs.filter(wsMatches), hit = wsMatches(w);
    if (!hit && !subHits.length) continue;
    shown += (hit ? 1 : 0) + subHits.length;
    rows.push(wsRow(w, rel));
    const open = S.open.has(w.id) || (searching && subHits.length > 0);
    if (open) { S.open.add(w.id); (searching ? subHits : subs).forEach((x, i, a) => rows.push(wsRow(x, st.rel.get(x.id), { last: i === a.length - 1 }))); }
  }
  const seg = (id, items, cur) => `<div class="seg" id="${id}" role="tablist">${items.map(([k, label, extra]) => `<button data-v="${k}" class="${k === cur ? 'active' : ''}" role="tab" aria-selected="${k === cur}">${label}${extra != null ? ` <span class="opt">${extra}</span>` : ''}</button>`).join('')}</div>`;
  const mains = tops.filter((w) => st.rel.get(w.id).kind === 'main');
  return `
    <div class="ax-h"><div><h1>Workspaces</h1><p>${shown === S.all.length ? n(S.all.length) : `${n(shown)} of ${n(S.all.length)}`} workspaces. When one account owns several, the oldest is the main one and the others are its sub-workspaces.</p></div>
      <div class="ax-tools">
        <div class="search-wrap" data-icon="search" data-icon-size="15"><input class="search" id="wsQ" placeholder="Search workspace, owner or email" value="${esc(S.wsQ)}" /></div>
        ${seg('wsF', WS_FILTERS.map(([k, l, fn]) => [k, l, S.all.filter(fn).length]), S.wsF)}
        ${mains.length ? `<button type="button" class="btn sm quiet" id="wsAllOpen">${mains.every((w) => S.open.has(w.id)) ? 'Collapse all' : 'Expand all'}</button>` : ''}
      </div>
    </div>
    ${pricingNote()}
    ${rows.length ? `<section class="ax-card ax-list"><div class="ax-rows ax-tree">${rowHead()}${rows.join('')}</div></section>` : emptyWs()}`;
}
const emptyWs = () => '<section class="ax-card ax-empty"><b>No workspaces match</b>Try another search or filter.</section>';

// --- People ----------------------------------------------------------------------------------------------------------
function people() {
  const by = new Map();
  for (const w of S.all) for (const m of w.members) {
    if (!m.id) continue;
    if (!by.has(m.id)) by.set(m.id, { ...m, ws: [] });
    by.get(m.id).ws.push({ id: w.id, name: w.name, role: m.role });
  }
  return [...by.values()].sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}
function peopleHtml() {
  const q = S.pQ.trim().toLowerCase(), asked = new Set(S.dels.map((d) => d.id));
  const list = people().filter((p) => !q || (p.email || '').toLowerCase().includes(q) || (p.name || '').toLowerCase().includes(q) || p.ws.some((w) => w.name.toLowerCase().includes(q)));
  return `
    <div class="ax-h"><div><h1>People</h1><p>Everyone with an account, and the workspaces they're in.</p></div>
      <div class="ax-tools"><div class="search-wrap" data-icon="search" data-icon-size="15"><input class="search" id="pQ" placeholder="Search name, email or workspace" value="${esc(S.pQ)}" /></div><button type="button" class="btn sm primary" id="ppAdd">${ic('zap', 14)}Add credits for a customer</button></div></div>
    ${prepaidHtml()}
    ${list.length ? `<section class="ax-card ax-list ax-people">
      <div class="ax-prow head"><span>Person</span><span class="c-ws">Workspaces</span><span class="c-joined">Joined</span><span></span></div>
      ${list.map((p) => `<div class="ax-prow">
        <span class="ax-who">${av(p.email, 'sm')}<div><b title="${esc(p.name || p.email)}">${esc(p.name || p.email)}</b><small title="${esc(p.email)}">${esc(p.email)}${p.admin ? '<span class="ax-tag main">Admin</span>' : ''}${asked.has(p.id) ? '<span class="ax-tag bad">Asked to delete</span>' : ''}</small></div></span>
        <span class="ax-wschips c-ws">${p.ws.map((w) => `<a class="ax-wschip" href="#/w/${w.id}/people">${av(w.name, 'sm')}<span>${esc(w.name)}</span><em>${w.role === 'owner' ? 'Owner' : 'Member'}</em></a>`).join('')}</span>
        <span class="c-joined ax-muted" style="font-size:13px">${date(p.createdAt)}</span>
        ${p.admin ? '<span class="ax-faint" style="justify-self:end;font-size:12.5px">Admin</span>' : `<button class="btn sm quiet danger" data-deluser="${p.id}">Delete account…</button>`}
      </div>`).join('')}
    </section>` : '<section class="ax-card ax-empty"><b>Nobody matches</b>Try another search.</section>'}`;
}

// Credits a customer paid for before signing up: added to their workspace when they sign up (or straight away if

function prepaidDlg() {
  const d = dlg(`<div class="adm-dlg-h"><b>Add credits for a customer</b><button class="adm-x" data-close aria-label="Close">×</button></div>

  d.onclick = (e) => { if (e.target === d || e.target.closest('[data-close]')) d.close(); };
  d.querySelector('#ppForm').onsubmit = async (e) => {
    e.preventDefault();
    const pack = d.querySelector('[name=ppPack]:checked').value, email = d.querySelector('#ppEmail').value.trim();
    const body = pack === 'custom' ? { email, credits: d.querySelector('#ppCredits').value, price: d.querySelector('#ppPrice').value } : { email, pack };
    const amount = pack === 'custom' ? Number(body.credits) : { '10k': 10000, '20k': 22000, '25k': 30000 }[pack];
    if (!amount) return toast('Enter how many credits', true);
    if (!confirm(`Add ${n(amount)} credits for ${email}? Only once they've paid.`)) return;
    const go = d.querySelector('#ppGo');
    go.disabled = true;
    try {
      const r = await api('/admin/prepaid', { method: 'POST', body: { ...body, note: d.querySelector('#ppNote').value } });

      toast(r.appliedTo ? `${n(r.credits)} credits added to ${r.appliedTo}` : `${n(r.credits)} credits waiting: added when ${email} signs up`);

  };

function wsIssues(w) {
  const list = w.reports || [];
  return `<section class="ax-card">${list.length ? list.map((r) => repRow(r, w.id, false)).join('') : '<div class="ax-empty"><b>No issues reported</b>Nobody in this workspace has reported a problem.</div>'}</section>`;
}
function wsSettings(w) {
  return `
    <section class="ax-card"><h3>${ic('settings', 16)}Limits and features</h3>
      <div class="ax-set"><div><b>Daily limit</b><span>Template messages this workspace can send in 24 hours. Leave it empty for no limit.</span></div>
        <div class="ax-inline"><input class="ax-limit" id="wsLimit" value="${w.dailyLimit ?? ''}" placeholder="No limit" inputmode="numeric" aria-label="Daily limit" /><button class="btn sm" id="wsLimitSave">Save</button></div></div>
      <div class="ax-set"><div><b>AI assistant</b><span>${w.aiBuiltIn ? 'Always on for your own workspaces.' : 'When it’s on, the owners can use it and choose which of their members can too.'}</span></div>
        <label class="adm-ai"><span class="toggle sm"><input type="checkbox" id="wsAi" ${w.ai ? 'checked' : ''} ${w.aiBuiltIn ? 'disabled' : ''} aria-label="AI assistant" /><span class="track"><span class="lbl on">ON</span><span class="lbl off">OFF</span><span class="knob"></span></span></span></label></div>
    </section>
    <section class="ax-card"><h3>${ic('file-text', 16)}Details</h3>
      <dl class="ax-kv"><dt>Workspace ID</dt><dd><code>${esc(w.id)}</code></dd><dt>Created</dt><dd>${date(w.createdAt)}</dd><dt>Meta API version</dt><dd><code>${esc(w.graphVersion || '—')}</code></dd><dt>Demo mode</dt><dd>${w.demoMode ? 'On' : 'Off'}</dd><dt>Campaigns</dt><dd>${n(w.campaigns)}</dd></dl>
    </section>
    <section class="ax-card ax-danger"><h3>${ic('lock', 16)}${w.suspended ? 'Suspended' : 'Suspend'}</h3>
      <div class="ax-set"><div><b>${w.suspended ? `Suspended${w.suspendedAt ? ' since ' + date(w.suspendedAt) : ''}` : 'Suspend this workspace'}</b><span>${w.suspended ? 'Its members are locked out and nothing is sent. Unsuspend to let them back in.' : 'Its members are locked out and sending stops until you unsuspend it. Nothing is deleted.'}</span></div>
        <button class="btn sm ${w.suspended ? '' : 'danger-solid'}" id="wsSuspend" data-to="${!w.suspended}">${w.suspended ? 'Unsuspend' : 'Suspend'}</button></div>
      <div class="ax-set"><div><b>Delete this workspace</b><span>${w.legacy ? 'This is the original workspace (the data from before workspaces existed), so it can’t be deleted here.' : 'Deletes its numbers, contacts, campaigns, messages and Assistant files for good. Its people keep their accounts and move to another workspace of theirs. Suspending can be undone; this can’t.'}</span></div>
        ${w.legacy ? '' : '<button class="btn sm danger-solid" id="wsDelete">Delete workspace…</button>'}</div>
    </section>`;
}
async function wsCredits(w) {
  const box = $('#wsBody');
  let c;
  try { c = S.credits || (S.credits = await api('/admin/workspaces/' + w.id + '/credits')); } catch (e) { box.innerHTML = `<section class="ax-card ax-empty"><b>Couldn't load credits</b>${esc(e.message)}</section>`; return; }
  const low = c.balance === 0 ? 'out' : c.balance < 500 ? 'low' : '';
  const kindText = (l) => (l.kind === 'add' ? 'Added' : l.kind === 'expire' ? 'Expired unused' : `${n(l.used)} used${l.refunded ? ` · ${n(l.refunded)} returned for failed messages` : ''}`);
  box.innerHTML = `
    ${c.live ? '' : '<div class="adm-pricing-off"><b>Pricing is off</b> (PRICING isn’t on), so nothing here applies yet. What you set is kept for when it’s on.</div>'}
    <div class="ax-grid2">
      <section class="ax-card"><h3>${ic('zap', 16)}Plan</h3>
        <div class="adm-cr-plan"><label><input type="radio" name="crPlan" value="free" ${c.on ? '' : 'checked'} /> Free plan</label><label><input type="radio" name="crPlan" value="credits" ${c.on ? 'checked' : ''} /> Credits plan</label></div>
        ${c.on ? `<div class="ax-bal ${low}">${Coin.html({ size: 52, label: `${n(c.balance)} credits` })}<b>${n(c.balance)}</b><span class="ax-muted">credits left</span></div>
          <p class="ax-muted" style="margin:0 0 4px;font-size:13px">WhatsApp numbers: ${c.numberLimit == null ? `${n(c.numbersUsed)} connected · no limit` : `${n(c.numbersUsed)} of ${n(c.numberLimit)}`}</p>` : '<p class="ax-muted" style="margin:0;font-size:13px">On the free plan nothing uses credits.</p>'}
        <p class="ax-faint" style="margin:10px 0 0;font-size:12.5px;line-height:1.5">Marketing message ${c.rates.marketing}, utility ${c.rates.utility}, AI reply or Assistant answer ${c.rates.ai} (any key), Assistant campaign plan ${c.rates.plan ?? 3}. Failed messages are refunded; packs last ${c.months} months.</p>
      </section>
      <section class="ax-card"><h3>${ic('plus', 16)}Add credits <span class="ax-faint" style="font-weight:400;font-size:12.5px">once they’ve paid</span></h3>
        <div class="adm-cr-add" style="margin-top:0">${c.packOptions.map((p) => `<button class="btn sm" data-pack="${p.id}">Add ₹${n(p.price)} → ${n(p.credits)}</button>`).join('')}</div>
        <div class="adm-cr-custom" style="margin-bottom:0"><input id="crN" inputmode="numeric" placeholder="Credits" aria-label="Credits" /><input id="crPrice" inputmode="numeric" placeholder="₹ paid" aria-label="Amount paid in rupees" /><input id="crNote" placeholder="Note (invoice, UTR…)" aria-label="Note" /><button class="btn sm" id="crCustom">Add</button></div>
      </section>
    </div>
    ${c.packs.length ? `<section class="ax-card"><h3>${ic('layers', 16)}Packs</h3><table class="ax-table"><thead><tr><th>Pack</th><th class="num">Credits</th><th class="num">Left</th><th class="num">Paid</th><th class="num">Added</th><th class="num">Expires</th></tr></thead><tbody>
      ${c.packs.map((p) => `<tr><td><b>${esc(p.name)}</b>${p.expired ? ' <span class="ax-tag">Expired</span>' : ''}</td><td class="num">${n(p.credits)}</td><td class="num">${n(p.left)}</td><td class="num">${p.price ? '₹' + n(p.price) : '—'}</td><td class="num ax-muted">${date(p.addedAt)}</td><td class="num ax-muted">${date(p.expiresAt)}</td></tr>`).join('')}
    </tbody></table></section>` : ''}
    <section class="ax-card"><h3>${ic('calendar-days', 16)}Activity</h3>
      ${c.ledger.length ? `<table class="ax-table ax-ledger"><tbody>${c.ledger.map((l) => `<tr><td><b>${esc(l.what)}</b><small>${esc(kindText(l))}</small></td><td class="num ax-muted">${ago(l.at)}</td><td class="num ${l.kind === 'add' ? 'add' : ''}"><b>${l.kind === 'add' ? '+' + n(l.used) : '−' + n(l.used - l.refunded)}</b></td></tr>`).join('')}</tbody></table>` : '<p class="ax-muted" style="margin:0">No activity yet.</p>'}
    </section>`;
  LA.hydrate(box);
}

// --- Actions -----------------------------------------------------------------------------------------------------------
document.addEventListener('input', (e) => {
  if (e.target.id === 'wsQ') { S.wsQ = e.target.value; keepFocus('wsQ', () => render()); }
  if (e.target.id === 'pQ') { S.pQ = e.target.value; keepFocus('pQ', () => render()); }
});
// Re-render while typing in a search box without losing the cursor.
function keepFocus(id, fn) { const pos = $('#' + id)?.selectionStart; Promise.resolve(fn()).then(() => { const el = $('#' + id); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }); }

document.addEventListener('click', async (e) => {
  const t = e.target;
  const seg = t.closest('.seg [data-v]');
  if (seg) {
    const id = seg.parentElement.id, v = seg.dataset.v;
    if (id === 'wsF') S.wsF = v;
    if (id === 'repF') S.repF = v;
    return render();
  }
  const tog = t.closest('[data-toggle]');
  if (tog) { const id = tog.dataset.toggle; S.open.has(id) ? S.open.delete(id) : S.open.add(id); return render(); }
  if (t.closest('#wsAllOpen')) {
    const st = structure(), mains = S.all.filter((w) => st.rel.get(w.id)?.kind === 'main');
    const all = mains.every((w) => S.open.has(w.id));
    mains.forEach((w) => (all ? S.open.delete(w.id) : S.open.add(w.id)));
    return render();
  }
  const row = t.closest('.ax-row[data-href]');
  if (row && !t.closest('a, button')) { location.hash = row.dataset.href; return; }
  const rep = t.closest('[data-rep]');
  if (rep) {
    try { await api('/admin/reports/' + rep.dataset.rep, { method: 'POST', body: { status: rep.dataset.to } }); toast(rep.dataset.to === 'resolved' ? 'Marked resolved' : 'Reopened'); await reload(); } catch (err) { toast(err.message, true); }
    return;
  }
  const dis = t.closest('[data-dismiss]');
  if (dis) { try { await api('/admin/users/' + dis.dataset.dismiss + '/dismiss-deletion', { method: 'POST' }); toast('Request dismissed'); await reload(); } catch (err) { toast(err.message, true); } return; }
  const del = t.closest('[data-deluser]');
  if (del) return deleteUserDlg(del.dataset.deluser);
  // Meta API version
  if (t.closest('#gvOpen')) { $('#gvOpen').classList.add('hidden'); $('#gvForm').classList.remove('hidden'); $('#gvTo').focus(); return; }
  if (t.closest('#gvCancel')) { $('#gvForm').classList.add('hidden'); $('#gvOpen').classList.remove('hidden'); return; }
  // Workspace settings
  const w = S.detail;
  if (t.closest('#wsLimitSave') && w) {
    try { await api('/admin/workspaces/' + w.id, { method: 'PATCH', body: { dailyLimit: $('#wsLimit').value.trim() } }); toast('Daily limit saved'); await reload(); } catch (err) { toast(err.message, true); }
    return;
  }
  const sus = t.closest('#wsSuspend');
  if (sus && w) {
    const to = sus.dataset.to === 'true';
    if (to && !confirm(`Suspend ${w.name}? Its members are locked out and sending stops.`)) return;
    try { await api('/admin/workspaces/' + w.id, { method: 'PATCH', body: { suspended: to } }); toast(to ? 'Suspended' : 'Unsuspended'); await reload(); } catch (err) { toast(err.message, true); }
    return;
  }
  if (t.closest('#wsDelete') && w) return deleteWorkspaceDlg(w);
  if (t.closest('#ppAdd')) return prepaidDlg();
  const ppc = t.closest('[data-pp-cancel]');
  if (ppc) {
    if (!confirm('Cancel these waiting credits? Nothing has been added yet.')) return;
    try { await api('/admin/prepaid/' + ppc.dataset.ppCancel, { method: 'DELETE' }); toast('Cancelled'); await reload(); } catch (err) { toast(err.message, true); }
    return;
  }
  // Credits
  const pack = t.closest('[data-pack]');
  if ((pack || t.closest('#crCustom')) && w && S.credits) {
    const c = S.credits;
    const body = pack ? { pack: pack.dataset.pack } : { credits: $('#crN').value, price: $('#crPrice').value };
    const amount = pack ? c.packOptions.find((p) => p.id === body.pack).credits : Number(body.credits);
    if (!amount) return toast('Enter how many credits', true);
    if (!confirm(`Add ${n(amount)} credits to ${w.name}? Only once they’ve paid.`)) return;
    try { await api('/admin/workspaces/' + w.id + '/credits', { method: 'POST', body: { ...body, note: $('#crNote').value } }); toast('Credits added'); await reload(); } catch (err) { toast(err.message, true); }
  }
});
document.addEventListener('change', async (e) => {
  const w = S.detail;
  if (e.target.id === 'wsAi' && w) {
    const on = e.target.checked;
    try { await api('/admin/workspaces/' + w.id, { method: 'PATCH', body: { ai: on } }); toast(on ? 'AI assistant on. The owners pick which members get it.' : 'AI assistant off for this workspace'); await reload(); }
    catch (err) { e.target.checked = !on; toast(err.message, true); }
  }
  if (e.target.name === 'crPlan' && w) {
    const v = e.target.value;
    if (v === 'credits' && !confirm(`Switch ${w.name} to the credits plan? From now on, template messages and AI use credits, and sending stops when they run out.`)) { render(); return; }
    try { await api('/admin/workspaces/' + w.id, { method: 'PATCH', body: { billing: v } }); toast(v === 'credits' ? 'On the credits plan' : 'On the free plan'); await reload(); } catch (err) { toast(err.message, true); }
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'wsLimit') $('#wsLimitSave')?.click(); });
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'gvForm') return;
  e.preventDefault();
  const to = $('#gvTo').value.trim();
  if (!confirm(`Move every workspace to ${to}? Each one's sending, Inbox and template sync will use it straight away.`)) return;
  try { const r = await api('/admin/graph-version', { method: 'POST', body: { version: to } }); toast(r.moved.length ? `Moved ${r.moved.length} workspace(s) to ${to}` : `Every workspace already uses ${to}`); await reload(); }
  catch (err) { toast(err.message, true); }
});

// Deleting a workspace (after typing its name): says what goes, and where its people end up.
function deleteWorkspaceDlg(w) {
  const others = (m) => people().find((p) => p.id === m.id)?.ws.filter((x) => x.id !== w.id) || [];
  const stranded = w.members.filter((m) => !others(m).length);
  const d = dlg(`<div class="adm-dlg-h"><b>Delete ${esc(w.name)}?</b><button class="adm-x" data-close aria-label="Close">×</button></div>
    <p class="sub">This deletes the workspace and everything in it right away. It can't be undone.</p>
    <ul class="del-plan">
      <li class="delete"><b>${n(w.numbers.length)} WhatsApp number${w.numbers.length === 1 ? '' : 's'}</b>, ${n(w.contacts)} contacts, ${n(w.campaigns)} campaigns, its chats and Assistant files — deleted</li>
      ${w.billing === 'credits' && w.credits ? `<li class="delete"><b>${n(w.credits)} unused credits</b> — gone with it</li>` : ''}
      ${w.members.map((m) => { const o = others(m); return `<li><b>${esc(m.email)}</b> — ${o.length ? `keeps their account, moves to ${esc(o[0].name)}` : 'has no other workspace'}</li>`; }).join('')}
    </ul>
    ${stranded.length ? `<p class="adm-pricing-off" style="margin:0 0 4px">${stranded.map((m) => esc(m.email)).join(', ')} would be left with no workspace, so this can't be deleted on its own. Delete ${stranded.length > 1 ? 'their accounts' : 'their account'} on the People tab instead; that removes this workspace too.</p>`
      : `<label class="adm-confirm">Type the workspace name to confirm<input id="admWsName" autocomplete="off" placeholder="${esc(w.name)}" /></label>`}
    <div class="adm-dlg-acts"><button class="btn quiet" data-close>Cancel</button>${stranded.length ? '' : '<button class="btn danger-solid" id="admWsGo" disabled>Delete workspace</button>'}</div>`);
  const input = d.querySelector('#admWsName'), go = d.querySelector('#admWsGo');
  input?.focus();
  if (input) input.oninput = () => { go.disabled = input.value.trim() !== w.name; };
  d.onclick = async (e) => {
    if (e.target === d || e.target.closest('[data-close]')) return d.close();
    if (e.target.closest('#admWsGo') && !go.disabled) {
      go.disabled = true;
      try {
        await api('/admin/workspaces/' + w.id, { method: 'DELETE', body: { confirm: input.value } });
        d.close();
        toast(`${w.name} deleted`);
        S.open.delete(w.id);
        location.hash = '#/workspaces';
        await reload();
      } catch (err) { toast(err.message, true); go.disabled = false; }
    }
  };
}

// Deleting an account (after typing their email): shows what happens to each of their workspaces first.
function dlg(html) {
  let d = document.getElementById('admDlg');
  if (!d) { d = document.createElement('dialog'); d.id = 'admDlg'; d.className = 'adm-dlg'; document.body.append(d); }
  d.innerHTML = html; if (!d.open) d.showModal(); return d;
}
async function deleteUserDlg(id) {
  let u;
  try { u = await api('/admin/users/' + id + '/plan'); } catch (err) { return toast(err.message, true); }
  const d = dlg(`<div class="adm-dlg-h"><b>Delete ${esc(u.name || u.email)}?</b><button class="adm-x" data-close aria-label="Close">×</button></div>
    <p class="sub">This permanently deletes <b>${esc(u.email)}</b> right away. It can't be undone. They get an email saying their account was deleted.</p>
    <ul class="del-plan">${u.plan.map((p) => `<li class="${p.action}"><b>${esc(p.name)}</b> — ${esc(p.text)}</li>`).join('') || '<li>Not in any workspace</li>'}</ul>
    <label class="adm-confirm">Type their email to confirm<input id="admDelEmail" autocomplete="off" placeholder="${esc(u.email)}" /></label>
    <div class="adm-dlg-acts"><button class="btn quiet" data-close>Cancel</button><button class="btn danger-solid" id="admDelGo" disabled>Delete account</button></div>`);
  const input = d.querySelector('#admDelEmail'), go = d.querySelector('#admDelGo');
  input.focus();
  input.oninput = () => { go.disabled = input.value.trim().toLowerCase() !== u.email; };
  d.onclick = async (e) => {
    if (e.target === d || e.target.closest('[data-close]')) return d.close();
    if (e.target.closest('#admDelGo') && !go.disabled) {
      go.disabled = true;
      try {
        await api('/admin/users/' + u.id + '/delete', { method: 'POST', body: { confirm: input.value } });
        d.close(); toast('Account deleted');
        if (S.detail && !S.all.some((x) => x.id === S.detail.id)) location.hash = '#/workspaces';
        await reload();
      } catch (err) { toast(err.message, true); go.disabled = false; }
    }
  };
}

// Expand / collapse the sidebar (remembered on this browser).
function drawCollapse() {
  const col = document.documentElement.classList.contains('ax-collapsed');
  const b = $('#axCollapse');
  b.innerHTML = ic('panel-left', 16);
  b.title = b.ariaLabel = col ? 'Expand sidebar' : 'Collapse sidebar';
  b.setAttribute('aria-expanded', String(!col));
}
$('#axCollapse').addEventListener('click', () => {
  const col = document.documentElement.classList.toggle('ax-collapsed');
  try { localStorage.setItem('ax-side', col ? 'collapsed' : 'open'); } catch {}
  drawCollapse();
});
drawCollapse();
render();
</script>
</body>
</html>
